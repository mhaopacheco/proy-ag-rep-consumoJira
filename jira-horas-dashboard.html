<title>Consumo de Horas · Detalle de caso — JTC</title>
<style>
:root {
  --bg:#ECF1F9; --sf:#FFF; --sf2:#F4F7FC; --bd:#CDD8EC;
  --ac:#1B63CF; --ac-s:#D6E5FA;
  --t1:#0C1929; --t2:#4A5B74; --t3:#8294AE;
  --dn-f:#1A9E5E; --dn-b:#E2F5EC;
  --ip-f:#1B63CF; --ip-b:#E0EBFC;
  --td-f:#7A8A9E; --td-b:#EDF1F6;
  --sh:0 1px 4px rgba(12,25,41,.08);
  --r:10px;
}
@media (prefers-color-scheme:dark) { :root {
  --bg:#0A1220; --sf:#121D30; --sf2:#192438; --bd:#24354E;
  --ac:#4A88EC; --ac-s:#0D1E40;
  --t1:#E0EAF6; --t2:#8095B0; --t3:#506070;
  --dn-f:#32BC72; --dn-b:#0A271E;
  --ip-f:#4A88EC; --ip-b:#0C1F3E;
  --td-f:#8A97AF; --td-b:#192438;
  --sh:0 1px 4px rgba(0,0,0,.28);
}}
:root[data-theme=light] {
  --bg:#ECF1F9; --sf:#FFF; --sf2:#F4F7FC; --bd:#CDD8EC;
  --ac:#1B63CF; --ac-s:#D6E5FA;
  --t1:#0C1929; --t2:#4A5B74; --t3:#8294AE;
  --dn-f:#1A9E5E; --dn-b:#E2F5EC;
  --ip-f:#1B63CF; --ip-b:#E0EBFC;
  --td-f:#7A8A9E; --td-b:#EDF1F6;
  --sh:0 1px 4px rgba(12,25,41,.08);
}
:root[data-theme=dark] {
  --bg:#0A1220; --sf:#121D30; --sf2:#192438; --bd:#24354E;
  --ac:#4A88EC; --ac-s:#0D1E40;
  --t1:#E0EAF6; --t2:#8095B0; --t3:#506070;
  --dn-f:#32BC72; --dn-b:#0A271E;
  --ip-f:#4A88EC; --ip-b:#0C1F3E;
  --td-f:#8A97AF; --td-b:#192438;
  --sh:0 1px 4px rgba(0,0,0,.28);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;padding:20px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:14px}

/* SEARCH */
.search-card{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px}
.search-input{flex:1;min-width:200px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:9px 14px;font-size:14px;color:var(--t1);font-family:'Consolas','Courier New',monospace;font-weight:700;letter-spacing:.03em;outline:none}
.search-input:focus{border-color:var(--ac)}
.search-input::placeholder{font-family:inherit;font-weight:400;color:var(--t3)}
.search-btn{background:var(--ac);border:none;border-radius:7px;padding:9px 20px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap}
.search-btn:hover{opacity:.9}
.search-btn:disabled{opacity:.6;cursor:default}
.search-status{font-size:12px;color:var(--t3);flex-basis:100%}
.search-status.err{color:#D94520;font-weight:600}
.theme-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--t2);cursor:pointer;flex-shrink:0}
.theme-btn:hover{color:var(--t1)}

/* HEADER */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.issue-key{font-family:'Consolas','Courier New',monospace;font-size:12px;font-weight:700;color:var(--ac);letter-spacing:.04em}
.issue-title{font-size:20px;font-weight:700;color:var(--t1);margin:3px 0 10px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--t2);align-items:center}
.meta strong{color:var(--t1);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.done{background:var(--dn-b);color:var(--dn-f)}
.inprog{background:var(--ip-b);color:var(--ip-f)}
.todo{background:var(--td-b);color:var(--td-f)}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr 1fr}}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.kpi-n{font-size:30px;font-weight:800;line-height:1;color:var(--t1);font-variant-numeric:tabular-nums}
.kpi-n.ac{color:var(--ac)}
.kpi-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-top:5px}
.kpi-sub{font-size:10px;color:var(--t3);margin-top:3px}

/* LINKED ISSUE CARD */
.li-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.li-key{font-family:'Consolas','Courier New',monospace;font-weight:700;font-size:13px;color:var(--ac)}
.li-summ{font-size:12px;color:var(--t2);margin-left:8px}
.li-tot{font-size:13px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}

/* MATRIX TABLE */
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;font-size:12px}
table.mx th,table.mx td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
table.mx th:first-child,table.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--sf)}
table.mx thead th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);border-bottom:2px solid var(--bd)}
table.mx tbody tr:hover td{background:var(--sf2)}
table.mx td.zero{color:var(--t3)}
table.mx tfoot td{font-weight:700;color:var(--t1);border-top:2px solid var(--bd);border-bottom:none}
table.mx tfoot td:first-child{background:var(--sf)}
.mx-name{color:var(--t1);font-weight:500}

.empty-state{padding:32px;text-align:center;color:var(--t3);font-size:14px}
.empty-state strong{display:block;font-size:18px;margin-bottom:6px;color:var(--t2)}
</style>

<div class="wrap">

  <!-- SEARCH -->
  <div class="card search-card">
    <input class="search-input" id="key-input" placeholder="Ej: ATIHD-50" autocomplete="off" spellcheck="false">
    <button class="search-btn" id="search-btn" onclick="runSearch()">Buscar</button>
    <button class="theme-btn" onclick="toggleTheme()">◑ Tema</button>
    <div class="search-status" id="search-status"></div>
  </div>

  <div id="content"></div>

</div>

<script>
const JIRA = 'https://justtimeconsulting.atlassian.net/browse/';
const STATUS_CAT = {
  'Finalizada':'done','Terminada':'done','Done':'done',
  'En curso':'inprog','In Progress':'inprog',
  'Tareas por hacer':'todo','To Do':'todo',
};
const MONTH_NAMES = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let CASE = null;

function statusCat(s) { return STATUS_CAT[s] || 'todo'; }
function monthLabel(m) { const [y, mo] = m.split('-'); return `${MONTH_NAMES[parseInt(mo,10)]} ${y}`; }
function fmtDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return `${parseInt(day,10)} ${MONTH_NAMES[parseInt(m,10)]} ${y}`;
}

function dark() {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches);
}
function toggleTheme() {
  document.documentElement.setAttribute('data-theme', dark() ? 'light' : 'dark');
}

/* Agrupa worklogs de un issue vinculado en matriz consultor x mes */
function buildMatrix(worklogs) {
  const months = [...new Set(worklogs.map(w => w.date.slice(0, 7)))].sort();
  const consultants = [...new Set(worklogs.map(w => w.consultant))];
  const grid = {};
  consultants.forEach(c => { grid[c] = {}; months.forEach(m => grid[c][m] = 0); });
  worklogs.forEach(w => { grid[w.consultant][w.date.slice(0,7)] = (grid[w.consultant][w.date.slice(0,7)] || 0) + w.hours; });

  const rows = consultants.map(c => {
    const total = months.reduce((s, m) => s + grid[c][m], 0);
    return { consultant: c, total: Math.round(total * 100) / 100, byMonth: grid[c] };
  }).sort((a, b) => b.total - a.total);

  const colTotals = {};
  months.forEach(m => { colTotals[m] = Math.round(rows.reduce((s, r) => s + r.byMonth[m], 0) * 100) / 100; });
  const grandTotal = Math.round(months.reduce((s, m) => s + colTotals[m], 0) * 100) / 100;

  return { months, rows, colTotals, grandTotal };
}

function renderMatrix(li) {
  const { months, rows, colTotals, grandTotal } = buildMatrix(li.worklogs);
  if (rows.length === 0) {
    return `<div class="li-hdr">
      <div><span class="li-key"><a href="${JIRA}${li.key}" target="_blank" rel="noopener">${li.key}</a></span><span class="li-summ">${li.summary}</span></div>
      <span class="li-tot">0h</span>
    </div>
    <div style="font-size:12px;color:var(--t3)">Sin horas registradas.</div>`;
  }
  return `<div class="li-hdr">
    <div><span class="li-key"><a href="${JIRA}${li.key}" target="_blank" rel="noopener">${li.key}</a></span><span class="li-summ">${li.summary} · ${li.status}</span></div>
    <span class="li-tot">${grandTotal}h</span>
  </div>
  <div class="mx-wrap">
    <table class="mx">
      <thead><tr>
        <th>Consultor</th>
        ${months.map(m => `<th>${monthLabel(m)}</th>`).join('')}
        <th>Total</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="mx-name">${r.consultant}</td>
          ${months.map(m => { const h = r.byMonth[m]; return `<td class="${h===0?'zero':''}">${h===0?'—':h}</td>`; }).join('')}
          <td><strong>${r.total}</strong></td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td>Total mes</td>
        ${months.map(m => `<td>${colTotals[m]}</td>`).join('')}
        <td>${grandTotal}</td>
      </tr></tfoot>
    </table>
  </div>`;
}

function render() {
  const content = document.getElementById('content');
  if (!CASE) { content.innerHTML = ''; return; }

  const allWorklogs = CASE.linked.flatMap(li => li.worklogs);
  const totalHours = Math.round(allWorklogs.reduce((s, w) => s + w.hours, 0) * 100) / 100;
  const consultants = new Set(allWorklogs.map(w => w.consultant));
  const withHours = CASE.linked.filter(li => li.worklogs.length > 0).length;
  const cat = statusCat(CASE.status);

  content.innerHTML = `
    <div class="card">
      <div class="hdr">
        <div>
          <div class="issue-key"><a href="${JIRA}${CASE.key}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${CASE.key}</a></div>
          <div class="issue-title">${CASE.summary}</div>
          <div class="meta">
            <span><strong>Asignado:</strong> ${CASE.assignee}</span>
            <span><strong>Creado:</strong> ${fmtDate(CASE.created)}</span>
            <span><strong>Actualizado:</strong> ${fmtDate(CASE.updated)}</span>
            <span class="pill ${cat}">${CASE.status}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-n ac">${totalHours}h</div>
        <div class="kpi-l">Horas consumidas</div>
      </div>
      <div class="kpi">
        <div class="kpi-n">${CASE.linked.length}</div>
        <div class="kpi-l">Issues vinculadas</div>
        <div class="kpi-sub">${withHours} con horas registradas</div>
      </div>
      <div class="kpi">
        <div class="kpi-n">${consultants.size}</div>
        <div class="kpi-l">Consultores activos</div>
      </div>
      <div class="kpi">
        <div class="kpi-n">${[...new Set(allWorklogs.map(w=>w.date.slice(0,7)))].length}</div>
        <div class="kpi-l">Meses con actividad</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Horas por consultor y mes — por issue vinculada</div>
      ${CASE.linked.length === 0
        ? '<div style="font-size:12px;color:var(--t3)">Este caso no tiene issues vinculadas.</div>'
        : CASE.linked.map((li, i) => `<div style="${i>0?'margin-top:22px;padding-top:18px;border-top:1px solid var(--bd)':''}">${renderMatrix(li)}</div>`).join('')}
    </div>
  `;
}

async function runSearch() {
  const input = document.getElementById('key-input');
  const key = input.value.trim().toUpperCase();
  const btn = document.getElementById('search-btn');
  const status = document.getElementById('search-status');

  if (!key) { status.className = 'search-status err'; status.textContent = 'Escribe un ID, ej: ATIHD-50'; return; }

  btn.disabled = true;
  status.className = 'search-status';
  status.textContent = 'Consultando Jira en vivo…';

  const params = new URLSearchParams(location.search);
  params.set('key', key);
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);

  try {
    const res = await fetch(`/api/jira-case?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error desconocido');
    CASE = data;
    status.className = '';
    status.textContent = '';
    render();
  } catch (err) {
    CASE = null;
    render();
    status.className = 'search-status err';
    status.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});

(function init() {
  const params = new URLSearchParams(location.search);
  const key = params.get('key');
  if (key) {
    document.getElementById('key-input').value = key.toUpperCase();
    runSearch();
  }
})();
</script>
